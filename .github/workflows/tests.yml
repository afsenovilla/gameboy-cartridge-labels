name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python run.py setup
      # Two of the upstream tests call functions that no longer exist in src/remove_photos.py; they fail on geon's main too.
      - run: python -m pytest -q tests --deselect tests/test_remove_photos.py::test_jobs_compare_a_big_print_within_itself_and_a_small_one_with_its_familys_biggest --deselect tests/test_remove_photos.py::test_glare_on_one_label_photo_is_damage_and_not_on_the_others
